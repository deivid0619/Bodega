<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="light">
<meta name="description" content="Inventario de la bodega: modelo 3D, escaneo, reserva y reportes.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bodega">
<title>Bodega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,500..900&display=swap" rel="stylesheet">
<style>
/* la pantalla de carga: se ve apenas se abre la app, antes de que llegue el
   codigo (y mientras se conecta con el servidor). La app la reemplaza al
   cargar; la misma la usa ui/Boot.jsx. */
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:#0B0B0B;color:#fff;font-family:'DM Sans',system-ui,-apple-system,sans-serif;text-align:center}
.boot-brand{display:flex;align-items:center;gap:10px;animation:boot-in 420ms cubic-bezier(.23,1,.32,1) both}
.boot-word{font:800 italic 40px/1 'DM Sans',system-ui,sans-serif;letter-spacing:-.055em;padding-right:3px}
.boot-bar{position:relative;width:132px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;animation:boot-in 420ms 120ms cubic-bezier(.23,1,.32,1) both}
.boot-bar i{position:absolute;inset:0;width:40%;border-radius:4px;background:#C0FF00;animation:boot-slide 1.1s cubic-bezier(.77,0,.175,1) infinite}
.boot-msg{max-width:280px;margin:0;min-height:2.6em;font-size:14px;line-height:1.35;color:#B9BDB6;animation:boot-in 420ms 220ms cubic-bezier(.23,1,.32,1) both}
.boot.page{position:absolute;background:transparent;color:#0B0B0B}
.boot.page .boot-bar{background:rgba(11,11,11,.1)}
.boot.page .boot-msg{color:#73766F}
@keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.boot-brand,.boot-bar,.boot-msg{animation:none}.boot-bar i{animation:boot-pulse 1.6s ease-in-out infinite;width:100%;transform:none}}
@keyframes boot-pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div id="root"><div class="boot" role="status" aria-live="polite"><div class="boot-brand"><svg viewBox="0 0 28 28" width="40" height="40" aria-hidden="true"><path d="M10.2 4.5h14.3l-2.6 4.6H7.6z" fill="#C0FF00"/><path d="M7.6 11.7h14.3l-2.6 4.6H5z" fill="#C0FF00"/><path d="M5 18.9h14.3l-2.6 4.6H2.4z" fill="#C0FF00"/></svg><span class="boot-word">bodega</span></div><div class="boot-bar"><i></i></div><p class="boot-msg">Abriendo…</p></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
