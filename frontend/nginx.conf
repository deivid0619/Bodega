# Sirve los archivos estáticos del build y reenvía /api al backend dentro
# de la red de docker-compose, para que el frontend siga hablando con
# rutas relativas (/api/...) igual que en desarrollo con el proxy de Vite.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
